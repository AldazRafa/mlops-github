apiVersion: v1
kind: Pod
metadata:
  name: animals-data-loader
  namespace: kubeflow
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 86400
      volumeMounts:
        - name: animals-data
          mountPath: /data
  volumes:
    - name: animals-data
      persistentVolumeClaim:
        claimName: animals-data
