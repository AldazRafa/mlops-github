# This is a basic workflow to help you get started with Actions

name: My First Workflow

# Controls when the workflow runs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # Use a GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run a one-line script
        run: echo "Hello, world!"

      - name: Run a multi-line script
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."

      - name: Build Docker image
        run: docker build -t hello-world-nginx:v1 ./DockerTest

      - name: Run Docker container
        run: docker run -d --name hello-world-nginx -p 8080:80 hello-world-nginx:v1

      - name: Test Docker container
        run: |
          sleep 2
          curl --fail http://localhost:8080
