# This is a basic workflow to help you get started with Actions

name: My First Workflow

# Controls when the workflow runs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # Run this job on the registered local Windows runner
    runs-on: [self-hosted, Windows, X64]

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo "Hello, world!"

      - name: Run a multi-line script
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hello-world-nginx
          tags: |
            type=raw,value=v1
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./DockerTest
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Run Docker container
        run: docker run -d --name hello-world-nginx -p 8080:80 hello-world-nginx:v1

      - name: Test Docker container
        run: |
          sleep 2
          curl --fail http://localhost:8080
