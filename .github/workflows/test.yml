# This is a basic workflow to help you get started with Actions

name: My First Workflow

permissions:
  contents: read
  packages: write

# Controls when the workflow runs
on:
  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # Run this job on the registered local Windows runner
    runs-on: [self-hosted, Windows, X64]

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo "Hello, world!"

      - name: Run a multi-line script
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aldazrafa/hello-world-nginx
          tags: |
            type=raw,value=v1
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./DockerTest
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Remove previous Docker container
        shell: powershell
        run: |
          $containerId = docker ps -aq --filter "name=^/hello-world-nginx$"
          if ($containerId) {
            docker rm -f hello-world-nginx
          }

      - name: Run Docker container
        run: docker run -d --name hello-world-nginx -p 8080:80 ghcr.io/aldazrafa/hello-world-nginx:v1

      - name: Test Docker container
        shell: powershell
        run: |
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing http://localhost:8080

      - name: Clean up Docker container
        if: always()
        shell: powershell
        run: |
          $containerId = docker ps -aq --filter "name=^/hello-world-nginx$"
          if ($containerId) {
            docker rm -f hello-world-nginx
          }

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: powershell
        run: docker push --all-tags ghcr.io/aldazrafa/hello-world-nginx
